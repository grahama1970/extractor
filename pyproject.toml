[project]
name = "extractor"
version = "1.0.0"
description = "Universal document extractor with AI enhancements: Extract content from PDF, DOCX, PPTX, XML, and HTML with advanced table detection and multi-LLM support."
requires-python = ">=3.10.11"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = [ "extraction", "document", "pdf", "docx", "pptx", "xml", "ocr", "ai", "table-detection", "multi-format",]
dependencies = [
 "pillow>=10.1.0,<11.0.0",
 "pdf2image>=1.16.0,<2",
 "pydantic>=2.4.2,<3",
 "pydantic-settings>=2.0.3,<3",
 "python-dotenv>=1.0.0,<2",
 "tqdm>=4.66.1,<5",
 "ftfy>=6.1.1,<7",
 "rapidfuzz>=3.8.1,<4",
 "regex>=2024.4.28,<2025",
 "pdftext~=0.6.2",
 "markdownify<0.13",
 "click>=8.1.7,<9",
 "typer>=0.16.0",
 "markdown2>=2.5.2,<3",
 "filetype>=1.2.0,<2",
 "pre-commit>=4.2.0,<5",
 "tree-sitter>=0.23.2",
 "asyncio>=3.4.3,<4",
 "json-repair>=0.44.1",
 "tree-sitter-languages>=1.10.2",
 "tree-sitter-language-pack>=0.7.3",
 "numpy>=2.2.6",
 "loguru>=0.7.0,<0.8",
 "beautifulsoup4>=4.13.4",
 "lxml>=5.3.0",
 "python-docx>=1.1.2",
 "docx2python>=3.5.0",
 "python-pptx>=1.0.2",
 "xlsxwriter>=3.2.0,!=3.2.3",
 "defusedxml>=0.7.1",
 "aiohttp>=3.11.18",
 "python-arango>=8.2.0",
 "redis>=6.2.0",
 "structlog>=24.0.0",
 "rich>=13.0.0",
 "pytest-asyncio>=0.24.0",
 "pymupdf>=1.26.1",
 "camelot-py>=1.0.9",
 "tenacity>=9.1.2",
 "pyperclip>=1.9.0",
 "nest-asyncio>=1.6.0",
 "docutils>=0.21.2",
 "trafilatura>=2.0.0",
 "ebooklib>=0.18",
 "odfpy>=1.4.1",
 "ijson>=3.4.0",
 "jsonpath-ng>=1.7.0",
 "aiofiles>=24.1.0",
 "unidecode>=1.4.0",
 "backoff>=2.2.1",
 "jsonpickle>=4.1.1",
 # Gate the local 'certainly' package (which pulls faiss-gpu) to Python < 3.11
 # On Python >= 3.11 use faiss-cpu instead (see markers above)
 "pdfplumber>=0.11.7",
 "ruff>=0.13.0",
 # SciLLM (fork) as a local file:// dependency; pairs with litellm runtime API
 "scillm @ file:///home/graham/workspace/experiments/litellm",
 "urlextract>=1.9.0",
 "strip_tags>=0.6",
 "sentence-transformers>=5.0.0",
 "pyflakes>=3.4.0",
 # Shared web-ingestion toolkit (local path per AGENT guidance)
 "fetcher @ file:///home/graham/workspace/experiments/fetcher",
]
[[project.authors]]
name = "Graham Anderson"
email = "graham@grahama.co"

[dependency-groups]
dev = [
 "jupyter>=1.0.0,<2",
 "datasets>=2.21.0,<3",
 "streamlit>=1.37.1,<2",
 "fastapi>=0.115.4,<0.116",
 "uvicorn>=0.33.0",
 "python-multipart>=0.0.16,<0.0.17",
 "pytest>=8.3.3,<9",
 "pytest-mock>=3.14.0,<4",
 "pytest-json-report>=1.5.0,<2",
 "apted==1.0.3",
 "distance==0.1.3",
 "lxml==5.3.0",
 "tabulate>=0.9.0,<0.10",
 "latex2mathml>=3.77.0,<4",
 "playwright>=1.49.1,<2",
 "pytest-html>=4.1.1",
 "psutil>=7.0.0",
 "types-requests>=2.32.0.20241016",
 "types-PyYAML>=6.0.12.20241221",
 "types-docutils>=0.21.0.20241020",
]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.optional-dependencies]
full = [ "mammoth>=1.9.0,<2", "openpyxl>=3.1.5,<4", "python-pptx>=1.0.2,<2", "ebooklib>=0.18,<0.19", "weasyprint~=63.1",]
# Minimal runtime deps to run Python smokes without heavy dev extras / GPU wheels
smokes = [
  # SciLLM already in core deps; keep smokes lean
  "python-dotenv>=1.0.0,<2",
  "typer>=0.16.0",
  "httpx>=0.28.0",
  "loguru>=0.7.0,<0.8",
  "pillow>=10.1.0,<11.0.0",
 "urlextract>=1.9.0",
 "strip_tags>=0.6",
  "tqdm>=4.66.1,<5",
  "json-repair>=0.44.1",
  "pymupdf>=1.26.1",
  "camelot-py>=1.0.9",
  "opencv-python-headless>=4.7.0",
  "pandas>=2.0.0",
  "tenacity>=9.1.2",
]
lessons = [
  "graph-memory @ file:///home/graham/workspace/experiments/memory",
]
prover = [
  # Optional Lean/FAISS powered extras (depends on local path); install on environments where available
  "certainly @ file:///home/graham/workspace/experiments/lean4",
]
accurate = [
  "torch>=2.5.1,<3",
  "transformers>=4.45.2,<5",
  "sentence-transformers>=5.0.0",
  "spacy>=3.8.7",
  "opencv-python>=4.11.0.86",
  "camelot-py>=1.0.9",
  "pandas>=2.0.0",
  "surya-ocr>=0.14.5,<0.15.0",
  "ghostscript>=0.7",
  "matplotlib>=3.10.3",
  "python-louvain>=0.16",
  "nomic>=3.5.3",
  "faiss-cpu>=1.11.0.post1; python_version >= \"3.11\"",
  "faiss-gpu>=1.7.2; python_version < \"3.11\"",
]
server = [
  "fastapi>=0.115.12",
  "uvicorn>=0.32.1",
  "flask>=3.1.1",
  "flask-cors>=6.0.1",
]
llm = [
  "openai>=1.65.2,<2",
  "anthropic>=0.56.0",
  "google-genai>=1.0.0,<2",
  # SciLLM-first; no litellm runtime dependency
]

# Debug-only group: install litellm when needed for provider debugging
## removed invalid [tool.uv.dependency-groups] block (uv warns); use [project.optional-dependencies] instead

[project.urls]
Repository = "https://github.com/grahama1970/extractor"
Forked-From = "https://github.com/VikParuchuri/marker"

[project.scripts]
extractor-cli = "extractor.cli.main:app"                     # legacy umbrella CLI (kept for compat)
extractor_single = "extractor.core.scripts.convert_single:convert_single_cli"
extractor_chunk_convert = "extractor.core.scripts.chunk_convert:chunk_convert_cli"
extractor_gui = "extractor.core.scripts.run_streamlit_app:streamlit_app_cli"
extractor_server = "extractor.core.scripts.server:server_cli"
pdf-tools = "extractor.cli.pdf_tools:app"
arxiv-extract = "memory.arxiv_extract_cli:main"
pipeline-happy = "extractor.pipeline.cli_happy:main"
# Core pipeline entrypoints (flattened API)
extract-pipeline = "extractor.pipeline.api:cli_main"
extract-sections = "extractor.pipeline.api:cli_main"
pipeline-run-all = "extractor.pipeline.run_all:app"
pipeline-run = "extractor.pipeline.cli_mode:app"
pipeline-validate-gold = "extractor.pipeline.tools.validate_gold_standard:app"
# Use Typer apps as entrypoints so CLI flags are parsed correctly
pipeline-compare-gold = "extractor.pipeline.tools.compare_to_gold:app"
pipeline-run-and-validate = "extractor.pipeline.tools.run_and_validate:app"
pipeline-quick-smoke = "extractor.pipeline.tools.quick_smoke:app"

[tool.hatch.build]
sources = [ "src",]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = [ "tests",]
markers = [ "filename(name): specify the filename for the pdf_document fixture",]
filterwarnings = [ "ignore::Warning",]
asyncio_mode = "auto"
addopts = "    -v\n    --tb=short\n    --strict-markers\n    --json-report\n    --json-report-file=test-results.json\n    --json-report-summary\n"

[tool.uv.workspace]
members = [
    "tmp/marker-test",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/extractor",
  "src/extractor/core/scripts/*.sh",
  "src/extractor/core/scripts/*.html",
  "memory",
]

[tool.hatch.build.targets.wheel]
packages = [ "src/extractor", "memory",]
include = [
  "src/extractor/core/scripts/*.sh",
  "src/extractor/core/scripts/*.html",
]

[tool.black]
line-length = 100
target-version = ["py310"]
# Black expects a single regex string for extend-exclude
extend-exclude = '''
(
  ^\.archive/|
  ^\.claude/|
  ^prototypes/|
  ^tools/gold_annotator_web/|
  ^node_modules/|
  ^\.next/|
  ^sessions/|
  ^repos/|
  ^artifacts/|
  ^tmp/
)
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  ".archive",
  ".claude",
  "prototypes",
  "tools/gold_annotator_web",
  "node_modules",
  ".next",
  "sessions",
  "repos",
  "artifacts",
  "tmp",
]

[tool.mypy]
python_version = "3.10"
pretty = true
color_output = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
  '^\.archive/',
  '^\.claude/',
  '^prototypes/',
  '^tools/gold_annotator_web/',
  '^node_modules/',
  '^\.next/',
  '^sessions/',
  '^repos/',
  '^artifacts/',
  '^tmp/',
]


[tool.ruff.lint.per-file-ignores]
# Demo/utility script organizing imports after top-level constants and docstrings
"src/extractor/unified_extractor.py" = ["E402"]

"src/extractor/core/schema/blocks/__init__.py" = ["F401"]
"src/extractor/core/schema/groups/__init__.py" = ["F401"]
"src/extractor/core/schema/text/__init__.py" = ["F401"]
"src/extractor/core/services/__init__.py" = ["F401"]
"src/extractor/core/processors/llm/__init__.py" = ["F401"]
