[project]
name = "mcp-extractor-tools"
version = "0.1.0"
description = "MCP server for document extraction tools"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastmcp",
    "mcp-logger-utils>=0.1.5",
    "python-dotenv",
    "loguru",
    "pymupdf>=1.23.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "marker-pdf",
    "aiofiles",
]

[project.scripts]
mcp-extractor-tools = "mcp_extractor_tools:mcp.run"
mcp-marker-pdf = "mcp_marker_pdf:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio",
]