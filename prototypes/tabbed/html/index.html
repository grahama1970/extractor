<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Annotation System - Three Prototype Variations</title>
    <!-- Inline favicon to avoid 404/connection-refused noise in preview -->
    <link rel="icon" type="image/svg+xml"
          href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="100%25" height="100%25" fill="%23000"/><text x="50%25" y="54%25" font-size="40" fill="%23fff" text-anchor="middle" dominant-baseline="middle">E</text></svg>'>
    <meta name="description" content="Explore three different prototype variations for PDF annotation interfaces, each with unique layouts and workflows for document analysis." />
    <meta name="author" content="Lovable" />

    <meta property="og:title" content="788255e6-c3d8-4d32-a3b1-fc76d66e9dfc" />
    <meta property="og:description" content="Lovable Generated Project" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <section id="pipeline-panel" style="border:1px solid #ccc; padding:10px; margin:12px;">
      <h2 style="margin:0 0 6px 0">Pipeline Control</h2>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button id="btn-list-pdfs">List PDFs</button>
        <select id="pdf-select"></select>
        <button id="btn-run-pipeline">Run Pipeline</button>
        <button id="btn-train">Start Training</button>
        <button id="btn-status">Status</button>
        <button id="btn-load-annotations">Load Annotations</button>
        <button id="btn-export-arango">Export → ArangoDB</button>
      </div>
      <pre id="pipeline-status" style="font-size:12px; background:#f8f8f8; padding:6px; white-space:pre-wrap;"></pre>
    </section>
    <section id="triage-panel" style="border:1px solid #ccc; padding:10px; margin:12px;">
      <h2 style="margin:0 0 6px 0">Triage Queue (High Risk)</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="refresh-triage">Refresh</button>
        <label>Band:
          <select id="triage-band">
            <option value="high">high</option>
            <option value="medium">medium</option>
            <option value="low">low</option>
            <option value="">(all)</option>
          </select>
        </label>
      </div>
      <div id="triage-items" style="display:flex;flex-direction:column;gap:6px;margin-top:8px;"></div>
    </section>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/triage.js"></script>
    <script type="module" src="/src/ui_pipeline.js"></script>
  </body>
</html>
