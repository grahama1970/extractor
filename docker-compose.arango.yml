version: '3.9'
services:
  arangodb:
    image: arangodb:3.11
    container_name: gamified-arango
    restart: unless-stopped
    ports:
      - "8529:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=openSesame
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -sS http://localhost:8529/_db/_system/_api/version >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - arango_data:/var/lib/arangodb3
      - arango_apps:/var/lib/arangodb3-apps
volumes:
  arango_data:
  arango_apps:

