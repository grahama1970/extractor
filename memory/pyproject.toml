[project]
name = "graph-memory"
version = "0.1.0"
description = "Graph Memory: shared Lessons Learned with BM25 + graph recall and FAISS proposer"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "python-arango>=8.2.0",
  "typer>=0.12",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
faiss = [ "faiss-cpu>=1.11.0.post1", "sentence-transformers>=3.0.0" ]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "src/graph_memory" ]


[project.scripts]
lessons-seed = "graph_memory.lessons.seed:app"
lessons-propose = "graph_memory.lessons.proposer:app"
lessons-recall = "graph_memory.lessons.recall:app"
lessons-related = "graph_memory.lessons.related:app"
lessons-multihop = "graph_memory.lessons.multihop:app"
lessons-approve = "graph_memory.lessons.edges:approve_app"
lessons-prune = "graph_memory.lessons.edges:prune_app"
lessons-recall-diff = "graph_memory.lessons.recall:diff_app"
