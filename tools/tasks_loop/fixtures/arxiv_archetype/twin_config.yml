layout: double
pages: 5
preset_id: arxiv
category: Scientific
description: "Academic papers (2-column, math, citations) - optimized for LaTeX-generated PDFs"
runtime:
  features:
    enable_proving: true
    # Learned from 264 arxiv PDFs: scientific papers take ~6% longer
    timeout_multiplier: 1.06
    # LaTeX tables need more sensitive line detection (thinner borders)
    table_strategy: "lattice_sensitive"
    line_scale: 12  # Higher sensitivity for thin LaTeX table lines
    edge_tol: 300   # More tolerance for edge detection
    # Domain for timeout model
    domain: "scientific"
    summarization_prompt: |
      Analyze this section of a scientific paper. Summarize the methodology, results, and key claims.
      Focus on the technical contribution. Preserve variable names and mathematical notation.
  errors:
    - hyphenation         # Column-break hyphenation common in 2-column
    - ligatures           # fi, fl, ff ligatures from LaTeX
    - split_tables        # Tables spanning columns
    - trapped_headers     # Headers trapped in page margins
    - latex_table_borders # Thin LaTeX table lines often missed
    - formula_fragments   # Equations split across lines
    - column_merge        # Text merging across columns
  detection:
    keywords: ["arXiv", "Abstract", "References", "Introduction", "Fig.", "Theorem", "Lemma", "Proof"]
    min_score: 2
    layout: double
    section_pattern: "^\\d+\\.\\s+[A-Z]"
    filename_triggers: ["arxiv", "paper", "journal", "proceedings", "2401", "2402", "2403", "2404", "2405", "2406", "2407", "2408", "2409", "2410", "2411", "2412", "2501", "2502", "2503", "2504", "2505", "2506", "2507", "2508", "2509", "2510", "2511", "2512", "2601", "2602"]
ambiguous_headers:
  - text: "Equation 1: Schrödinger equation"
    size: 10
    font: "Times-Italic"
  - text: "Note: [1] indicates a citation"
    size: 9
tables:
  false_header_text: "TABLE CONTINUES"
  strict_verification: true
false_positives:
  - text: "This is not a requirement, just a comment."
  - text: "The researchers should eventually consider testing."
critical_content:
  - id: "REQ-SCI-001"
    text: "The pipeline shall correctly segment 2-column layouts."
    type: "Requirement"
    strict_verification: true
  - id: "REQ-SCI-002"
    text: "Equations must be preserved as discrete blocks."
    type: "Requirement"
    strict_verification: true
text_noise:
  - "ArXiv:2401.12345v1 [cs.LG] 1 Jan 2024"
  - "Page 1 of 5"
