name: Pipeline CI (deterministic + live)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  det:
    name: Deterministic CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Deterministic run + contract test
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          STAGE05_LLM_SPLIT_1COL: '0'
          STAGE06B_EMIT_MERGE_HINTS: '0'
        run: |
          python -m extractor.pipeline.run_pipeline \
            --pdf data/input/pipeline/BHT_CV32A65X_with_requirements_noannots.pdf \
            --out data/results/pipeline_det \
            --summary-only --skip-fig-descriptions --annotate-pdf --stop-on-fail
          pytest -q tests/contract/test_contract_bht_det.py

  live:
    name: Live CI (self-hosted)
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Live run + verify
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          # Expect CHUTES_* set on the self-hosted runner environment
          STAGE05_LLM_SPLIT_1COL: '1'
          STAGE06B_EMIT_MERGE_HINTS: '1'
        run: |
          make ci-live LIVE_PDF=data/input/pipeline/BHT_CV32A65X_with_requirements_noannots.pdf LIVE_OUT=data/results/pipeline_live
