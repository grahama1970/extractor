name: api-smokes
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install node deps (none required)
        run: node -v
      - name: Probe BASE_URL and skip if unreachable
        env:
          BASE_URL: ${{ secrets.LOCAL_BASE_URL }}
        run: |
          echo "BASE_URL=${BASE_URL:-unset}"
          if [ -z "$BASE_URL" ]; then echo "No BASE_URL provided; skipping"; exit 0; fi
          if ! curl -fsS --max-time 3 "$BASE_URL/api/health/llm" >/dev/null; then echo "Server not reachable; skipping"; exit 0; fi
      - name: Run API model smoke (optional)
        if: ${{ env.BASE_URL != '' }}
        env:
          BASE_URL: ${{ secrets.LOCAL_BASE_URL }}
        run: node scripts/smokes/api_generate_model.mjs || true
