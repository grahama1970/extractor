name: python-fast
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest mypy
      - name: Ruff
        run: ruff check .
      - name: Black (check)
        run: black --check .
      - name: Mypy (best-effort)
        run: mypy src || true
      - name: Pytest (best-effort)
        run: pytest -q || true
