name: python-core

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Core clean-install contract
        run: bash scripts/ci_core.sh

      - name: Upload core artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-core-artifacts
          path: local/artifacts/ci_core/**
          if-no-files-found: warn
