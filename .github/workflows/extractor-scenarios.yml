name: Extractor Scenarios

on:
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  pr-extractor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e . || true
          pip install beautifulsoup4 lxml markdownify trafilatura ebooklib docutils openpyxl odfpy python-pptx python-docx docx2python pillow defusedxml
      - name: Run extractor scenarios (fail-fast)
        env:
          SCENARIOS_ARTIFACT_ROOT: scripts/artifacts
          SCENARIOS_STOP_ON_FIRST_FAILURE: '1'
        run: |
          if [ -f scenarios/extractors/run_all.py ]; then
            PYTHONPATH=src python scenarios/extractors/run_all.py
          else
            echo "No extractor scenarios runner found; skipping."
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extractor-scenarios
          path: scripts/artifacts

  nightly-extractor:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e . || true
          pip install beautifulsoup4 lxml markdownify trafilatura ebooklib docutils openpyxl odfpy python-pptx python-docx docx2python pillow defusedxml
      - name: Run extractor scenarios with cross-format enforcement
        env:
          SCENARIOS_ARTIFACT_ROOT: scripts/artifacts
          CROSS_FORMAT_ENFORCE: '1'
          CROSS_FORMAT_HEADING_OVERLAP: '0.8'
          CROSS_FORMAT_TABLE_PARITY: '0.8'
          CROSS_FORMAT_FIGURE_CAPTIONS: '0.8'
        run: |
          if [ -f scenarios/extractors/run_all.py ]; then
            PYTHONPATH=src python scenarios/extractors/run_all.py || true
          else
            echo "No extractor scenarios runner found; skipping."
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extractor-scenarios-nightly
          path: scripts/artifacts
