name: Extractor Lint (Ruff/Black)

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  extractor-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff ratchet
        run: |
          uv run ruff check \
            src/extractor/cli_app.py \
            src/extractor/application \
            src/extractor/integrations/tau.py \
            tests/contracts/test_agent_skill_wrapper.py \
            tests/contracts/test_clean_install_contract.py \
            tests/contracts/test_console_entrypoint.py \
            tests/contracts/test_dependency_boundaries.py

      - name: Shell syntax
        run: |
          bash -n scripts/ci_core.sh
          bash -n scripts/prove_agent_skill_wrapper.sh

      - name: Core clean-install contract
        run: bash scripts/ci_core.sh

      - name: Upload lint artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extractor-lint-logs
          path: |
            .
          if-no-files-found: ignore
