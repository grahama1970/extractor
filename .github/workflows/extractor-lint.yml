name: Extractor Lint (Ruff/Black)

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  extractor-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install formatters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Ruff (src/extractor only)
        run: ruff check src/extractor

      - name: Black (check src/extractor)
        run: black --check src/extractor

      - name: Upload lint artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extractor-lint-logs
          path: |
            .
          if-no-files-found: ignore

