version: '3.8'

services:
  arango:
    image: arangodb:3.11
    container_name: arango
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASS:-openSesame}
    ports:
      - "8529:8529"
    volumes:
      - arango-data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8529/_api/version"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: extractor-server
    environment:
      ARANGO_HOST: arango
      ARANGO_PORT: 8529
      ARANGO_USERNAME: root
      ARANGO_PASS: ${ARANGO_PASS:-openSesame}
      ARANGO_DB: marker
    ports:
      - "8000:8000"
    depends_on:
      - arango
    # Security hardening suggestions (enable as needed):
    # read_only: true
    # cap_drop: ["ALL"]
    # tmpfs:
    #   - /tmp

  # runner (optional; for CI or secure runs)
  # runner:
  #   image: mcr.microsoft.com/playwright:v1.49.1-jammy
  #   container_name: orchestrator-runner
  #   working_dir: /app
  #   volumes:
  #     - .:/app:ro
  #     - ./artifacts:/artifacts
  #   environment:
  #     API_BASE: http://server:8000
  #   depends_on:
  #     - server
  #   command: >
  #     bash -lc "pip install -U pip && pip install -e .[dev] && \
  #     python scripts/orchestrator.py run --manifest data/manifests/sample_variations_manifest.json --use-codex --codex-bin codex --sandbox workspace-write"

volumes:
  arango-data:

