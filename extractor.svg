
<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="200" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc"
    role="img" preserveAspectRatio="xMidYMid meet">
    <title id="title">Extractor — Can Opener Logo</title>
    <desc id="desc">A modern, accessible, animated SVG logo: a stylized can opener with rotating gear and cutting wheel.
        Motion respects reduced-motion settings. Colors adapt to dark mode.</desc>

    <defs>
        <!-- Accent gradient for a subtle techno feel -->
        <radialGradient id="accentGrad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#7dd3fc" />
            <stop offset="100%" stop-color="#22d3ee" />
        </radialGradient>

        <!-- Soft shadow for gentle depth -->
        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.25" />
        </filter>

        <!-- Reusable rounded rectangle path for handles -->
        <path id="handleShape" d="M8 0h184a8 8 0 0 1 8 8v9a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8V8a8 8 0 0 1 8-8z" />
    </defs>

    <style>
        :root {
            --fg: #1f2937;
            /* slate-800 */
            --metal: #9ca3af;
            /* gray-400 */
            --metal-stroke: #6b7280;
            /* gray-500 */
            --handle: #111827;
            /* gray-900 */
            --gear: url(#accentGrad);
            --gear-muted: #60a5fa;
            /* blue-400 */
            --title: #0f172a;
            /* slate-950 */
            --muted: #475569;
            /* slate-600 */
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --fg: #e5e7eb;
                /* gray-200 */
                --metal: #a3a3a3;
                /* neutral-400 */
                --metal-stroke: #6b7280;
                /* gray-500 */
                --handle: #0b0f1a;
                /* deep slate */
                --gear-muted: #93c5fd;
                /* blue-300 */
                --title: #e5e7eb;
                --muted: #cbd5e1;
            }
        }

        /* Global SVG tuning */
        svg {
            shape-rendering: geometricPrecision;
            text-rendering: optimizeLegibility;
        }

        .logo {
            filter: url(#softShadow);
        }

        .handle {
            fill: var(--handle);
        }

        .metal {
            fill: var(--metal);
            stroke: var(--metal-stroke);
            stroke-width: 1;
        }

        .gear {
            fill: none;
            stroke: var(--gear);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 10 8;
            vector-effect: non-scaling-stroke;
        }

        .cutter {
            fill: none;
            stroke: var(--muted);
            stroke-width: 3;
            vector-effect: non-scaling-stroke;
        }

        .accent-arc {
            fill: none;
            stroke: var(--gear-muted);
            stroke-width: 3;
            stroke-linecap: round;
            opacity: 0.9;
            vector-effect: non-scaling-stroke;
        }

        .title-text {
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.3px;
            fill: var(--title);
            text-anchor: middle;
        }

        /* Motion */
        .spin {
            animation: spin 2.6s linear infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .reverse {
            animation-direction: reverse;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Respect user motion preferences */
        @media (prefers-reduced-motion: reduce) {
            .spin {
                animation: none;
            }
        }
    </style>

    <!-- Product name -->
    <text x="160" y="182" class="title-text">Extractor</text>

    <!-- Logo assembly -->
    <g class="logo" aria-hidden="true">
        <!-- Twin handles (using path reference for consistent rounding) -->
        <g transform="translate(20,58)">
            <use href="#handleShape" class="handle" />
            <g transform="translate(0,32)">
                <use href="#handleShape" class="handle" />
            </g>
            <!-- Pivot rivet -->
            <circle cx="5" cy="17" r="6" class="metal" />
        </g>

        <!-- Right-side mechanism block -->
        <rect x="210" y="50" width="62" height="56" rx="6" class="metal" />

        <!-- Gripping gear (toothed ring) -->
        <circle cx="241" cy="88" r="13" class="gear spin" />

        <!-- Cutting wheel (solid ring) -->
        <circle cx="241" cy="52" r="11" class="cutter spin reverse" />

        <!-- Knob / turning key -->
        <g class="spin" transform="translate(221,12)">
            <rect x="0" y="0" width="40" height="16" rx="6" class="handle" />
            <circle cx="20" cy="8" r="5.2" class="metal" />
        </g>

        <!-- Accent arc to suggest motion / extraction -->
        <path class="accent-arc" d="M258 40a22 22 0 0 1 0 44" />
    </g>
</svg>
